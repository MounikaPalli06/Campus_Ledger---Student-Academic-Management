{% extends 'base.html' %}
{% block title %}Register student{% endblock %}
{% block content %}
<a class="back-link" href="{{ url_for('main.dashboard') }}">&#8592; Student directory</a>
<section class="page-heading compact"><div><p class="eyebrow">MONGODB / STUDENT PROFILE</p><h1>Register a student</h1><p class="lede">Contact and enrollment details are stored in MongoDB.</p></div></section>
<form class="form-panel" method="post">
  <input type="hidden" name="_csrf_token" value="{{ csrf_token() }}">
  <div class="form-grid">
    <label>Student ID<input name="student_id" value="{{ student.get('student_id', '') }}" placeholder="e.g. STU2026001" required maxlength="24"></label>
    <label>Full name<input name="name" value="{{ student.get('name', '') }}" placeholder="Student name" required maxlength="100"></label>
    <label>Email address<input type="email" name="email" value="{{ student.get('email', '') }}" placeholder="student@college.edu" required maxlength="160"></label>
    <label>Department<input name="department" value="{{ student.get('department', '') }}" placeholder="e.g. Computer Science" required maxlength="100"></label>
    <label>Year of study<select name="year_of_study" required><option value="">Select year</option>{% for year in range(1, 7) %}<option value="{{ year }}" {% if student.get('year_of_study') == year|string %}selected{% endif %}>Year {{ year }}</option>{% endfor %}</select></label>
    <label>Initial student password<input type="password" name="password" minlength="8" autocomplete="new-password" required><small>Students sign in with this password and their student ID.</small></label>
  </div>
  <div class="form-actions"><a class="button secondary" href="{{ url_for('main.dashboard') }}">Cancel</a><button class="button primary" type="submit">Create student and account</button></div>
</form>
{% endblock %}
