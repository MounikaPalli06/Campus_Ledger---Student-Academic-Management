{% extends 'base.html' %}
{% block title %}Change password{% endblock %}
{% block content %}
<a class="back-link" href="{{ url_for('main.student_dashboard') }}">&#8592; My portal</a>
<section class="page-heading compact"><div><p class="eyebrow">STUDENT PORTAL / ACCOUNT SECURITY</p><h1>Change your password</h1><p class="lede">Choose a password of at least 8 characters.</p></div></section>
<form class="form-panel" method="post">
  <input type="hidden" name="_csrf_token" value="{{ csrf_token() }}">
  <div class="form-grid">
    <label>Current password<input type="password" name="current_password" autocomplete="current-password" required></label>
    <label>New password<input type="password" name="new_password" minlength="8" autocomplete="new-password" required></label>
  </div>
  <div class="form-actions"><a class="button secondary" href="{{ url_for('main.student_dashboard') }}">Cancel</a><button class="button primary" type="submit">Update password</button></div>
</form>
{% endblock %}
